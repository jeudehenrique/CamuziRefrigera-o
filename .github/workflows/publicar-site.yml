# Publica o site no GitHub Pages (camuzirefrigeração.com.br) a cada envio para a main.
# A página continua sendo editada em prototipo/camuzi-home.html; aqui ela vira o index.html do site.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site
        run: |
          mkdir _site
          cp -r prototipo/assets _site/assets
          {
            printf '<!doctype html>\n<html lang="pt-BR">\n<head>\n<meta charset="utf-8">\n'
            # o <head> termina antes do primeiro elemento visível (o sprite de ícones)
            grep -v 'name="claude:' prototipo/camuzi-home.html \
              | awk '!done && /^<svg width="0"/ { print "</head>\n<body>"; done=1 } { print }'
            printf '</body>\n</html>\n'
          } > _site/index.html
          grep -q '^</head>$' _site/index.html || { echo "fim do <head> não encontrado"; exit 1; }
          echo "xn--camuzirefrigerao-snb5e.com.br" > _site/CNAME
          # SEO: mapa do site (com a data da publicação) e regras para os buscadores
          URL="https://xn--camuzirefrigerao-snb5e.com.br"
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>%s/</loc><lastmod>%s</lastmod></url>\n</urlset>\n' "$URL" "$(date -u +%F)" > _site/sitemap.xml
          printf 'User-agent: *\nAllow: /\n\nSitemap: %s/sitemap.xml\n' "$URL" > _site/robots.txt
          # endereço errado ou link antigo (ex.: /prototipo/camuzi-home.html) leva para a página inicial
          printf '<!doctype html>\n<html lang="pt-BR">\n<meta charset="utf-8">\n<title>Camuzi Refrigeração</title>\n<meta name="robots" content="noindex">\n<meta http-equiv="refresh" content="0; url=/">\n<script>location.replace("/")</script>\n<a href="/">Ir para o site da Camuzi Refrigeração</a>\n' > _site/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
