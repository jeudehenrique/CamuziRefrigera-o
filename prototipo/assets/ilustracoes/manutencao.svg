<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Técnico da Camuzi fazendo manutenção preventiva com checklist e ar-condicionado gelando">
  <style>
    .air path{stroke-dasharray:6 8; animation:air 1.6s linear infinite}
    .chk{stroke-dasharray:14; stroke-dashoffset:14; animation:chk 4.5s ease-out infinite}
    .chk.b{animation-delay:.5s}.chk.c{animation-delay:1s}
    .ndl{transform-origin:270px 150px; animation:ndl 3s ease-in-out infinite}
    @keyframes air{to{stroke-dashoffset:-28}}
    @keyframes chk{0%{stroke-dashoffset:14}15%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
    @keyframes ndl{0%,100%{transform:rotate(-50deg)}50%{transform:rotate(10deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important} .chk{stroke-dashoffset:0}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF5FF"/><stop offset="1" stop-color="#DCEBFF"/></linearGradient>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22B8F0"/><stop offset="1" stop-color="#22B8F0" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0A2A5C" flood-opacity=".2"/></filter>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <rect y="176" width="320" height="24" fill="#CFE0F5"/>
  <circle cx="40" cy="30" r="40" fill="#FFFFFF" opacity=".5"/>

  <!-- ar-condicionado funcionando -->
  <rect x="150" y="24" width="146" height="44" rx="12" fill="#FFFFFF" filter="url(#sh)"/>
  <rect x="162" y="56" width="122" height="5" rx="2.5" fill="#C9D6E3"/>
  <text x="280" y="44" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1466F0" text-anchor="end">23°</text>
  <circle cx="284" cy="34" r="2" fill="#17A653"/>
  <g class="air" fill="none" stroke="url(#air)" stroke-width="2.5" stroke-linecap="round">
    <path d="M180 66 c-4 18 8 30 2 52"/><path d="M210 68 c-3 18 7 30 2 54"/><path d="M240 68 c3 18 -7 30 -2 54"/><path d="M270 66 c4 18 -8 30 -2 52"/>
  </g>

  <!-- manômetro / termômetro de desempenho -->
  <g transform="translate(0 0)">
    <circle cx="270" cy="150" r="20" fill="#FFFFFF" filter="url(#sh)"/>
    <path d="M254 156 A17 17 0 0 1 286 156" fill="none" stroke="#E5ECF5" stroke-width="5" stroke-linecap="round"/>
    <path d="M254 156 A17 17 0 0 1 270 133" fill="none" stroke="#17A653" stroke-width="5" stroke-linecap="round"/>
    <line class="ndl" x1="270" y1="150" x2="270" y2="136" stroke="#0A2A5C" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="270" cy="150" r="3" fill="#0A2A5C"/>
  </g>

  <!-- técnico com checklist -->
  <path d="M86 176 L90 142" stroke="#1F2D45" stroke-width="10" stroke-linecap="round"/>
  <path d="M104 176 L101 142" stroke="#1F2D45" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="84" cy="178" rx="7" ry="3.5" fill="#152033"/><ellipse cx="106" cy="178" rx="7" ry="3.5" fill="#152033"/>
  <rect x="80" y="100" width="30" height="46" rx="9" fill="#0A2A5C"/>
  <circle cx="102" cy="112" r="3.5" fill="#22B8F0"/>
  <rect x="91" y="93" width="9" height="9" rx="3" fill="#D9A07A"/>
  <circle cx="95" cy="84" r="11.5" fill="#D9A07A"/>
  <path d="M83.5 83 a11.5 11.5 0 0 1 23 -2 q-7 -6 -16 -2 q-5 1 -7 4z" fill="#2B1D16"/>
  <!-- prancheta -->
  <g transform="rotate(-8 136 118)">
    <rect x="118" y="96" width="36" height="46" rx="4" fill="#FFFFFF" stroke="#1466F0" stroke-width="1.6"/>
    <rect x="128" y="92" width="16" height="7" rx="2" fill="#1466F0"/>
    <path class="chk" d="M123 108 l3 3 5 -6" fill="none" stroke="#17A653" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="chk b" d="M123 120 l3 3 5 -6" fill="none" stroke="#17A653" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="chk c" d="M123 132 l3 3 5 -6" fill="none" stroke="#17A653" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#C3D1E2" stroke-width="2" stroke-linecap="round"><line x1="135" y1="108" x2="148" y2="108"/><line x1="135" y1="120" x2="148" y2="120"/><line x1="135" y1="132" x2="146" y2="132"/></g>
  </g>
  <path d="M106 108 L118 124" stroke="#0A2A5C" stroke-width="8" stroke-linecap="round"/>
  <path d="M118 124 L126 124" stroke="#D9A07A" stroke-width="6" stroke-linecap="round"/>
  <!-- braço apontando para o aparelho -->
  <path d="M84 106 L72 88" stroke="#0A2A5C" stroke-width="8" stroke-linecap="round"/>
  <path d="M72 88 L66 72" stroke="#D9A07A" stroke-width="6" stroke-linecap="round"/>
  <!-- caneta -->
  <rect x="62" y="62" width="4" height="12" rx="1.5" fill="#1466F0" transform="rotate(-20 64 68)"/>
</svg>
