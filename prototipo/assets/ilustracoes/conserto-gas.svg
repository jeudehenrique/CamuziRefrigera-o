<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Técnico da Camuzi medindo a pressão do gás com manifold ligado à condensadora e ao cilindro de gás">
  <style>
    .fan{transform-origin:244px 104px; animation:spin 1.4s linear infinite}
    .n1{transform-origin:106px 104px; animation:n1 2.6s ease-in-out infinite}
    .n2{transform-origin:136px 104px; animation:n2 2.6s ease-in-out infinite}
    .flow{stroke-dasharray:3 9; animation:flow 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes n1{0%,100%{transform:rotate(-60deg)}50%{transform:rotate(15deg)}}
    @keyframes n2{0%,100%{transform:rotate(-40deg)}50%{transform:rotate(35deg)}}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF5FF"/><stop offset="1" stop-color="#DCEBFF"/></linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#17A39A"/><stop offset=".5" stop-color="#2CC7BC"/><stop offset="1" stop-color="#128A82"/></linearGradient>
    <filter id="sh" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0A2A5C" flood-opacity=".2"/></filter>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <rect y="176" width="320" height="24" fill="#CFE0F5"/>
  <circle cx="290" cy="30" r="44" fill="#FFFFFF" opacity=".5"/>

  <!-- condensadora no suporte -->
  <path d="M200 140 H306 M206 140 L292 168 M300 140 V168" stroke="#8FA3BC" stroke-width="4" stroke-linecap="round" fill="none"/>
  <rect x="196" y="66" width="110" height="74" rx="8" fill="#F4F7FA" stroke="#C9D6E3" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="244" cy="104" r="28" fill="#E3EAF2" stroke="#B9C8D8" stroke-width="1.5"/>
  <g class="fan" fill="#9DB0C7"><path d="M244 104 C 240 90, 250 82, 254 86 C 252 94, 248 100, 244 104z"/><path d="M244 104 C 258 100, 266 110, 262 114 C 254 112, 248 108, 244 104z"/><path d="M244 104 C 248 118, 238 126, 234 122 C 236 114, 240 108, 244 104z"/><path d="M244 104 C 230 108, 222 98, 226 94 C 234 96, 240 100, 244 104z"/></g>
  <circle cx="244" cy="104" r="4" fill="#8FA3BC"/>
  <!-- válvulas de serviço -->
  <rect x="300" y="116" width="10" height="6" rx="2" fill="#B08D57"/><rect x="300" y="128" width="10" height="6" rx="2" fill="#B08D57"/>

  <!-- cilindro de gás -->
  <rect x="156" y="128" width="26" height="48" rx="9" fill="url(#cyl)"/>
  <rect x="162" y="120" width="14" height="10" rx="3" fill="#0A2A5C"/>
  <rect x="160" y="146" width="18" height="12" rx="2" fill="#FFFFFF" opacity=".9"/>

  <!-- mangueiras -->
  <path d="M136 120 C 150 168, 270 172, 306 131" fill="none" stroke="#1466F0" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M146 118 C 170 150, 280 160, 306 119" fill="none" stroke="#E5484D" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M121 122 C 124 146, 160 112, 169 120" fill="none" stroke="#F2B705" stroke-width="3.5" stroke-linecap="round"/>
  <path class="flow" d="M146 118 C 170 150, 280 160, 306 119" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>

  <!-- manifold (manômetros) -->
  <rect x="94" y="110" width="56" height="13" rx="4" fill="#3A4A63"/>
  <circle cx="106" cy="104" r="13" fill="#FFFFFF" stroke="#1466F0" stroke-width="3.5"/>
  <circle cx="136" cy="104" r="13" fill="#FFFFFF" stroke="#E5484D" stroke-width="3.5"/>
  <line class="n1" x1="106" y1="104" x2="106" y2="94" stroke="#0A2A5C" stroke-width="2" stroke-linecap="round"/>
  <line class="n2" x1="136" y1="104" x2="136" y2="94" stroke="#0A2A5C" stroke-width="2" stroke-linecap="round"/>
  <circle cx="106" cy="104" r="2" fill="#0A2A5C"/><circle cx="136" cy="104" r="2" fill="#0A2A5C"/>

  <!-- técnico segurando o manifold -->
  <path d="M52 176 L56 142" stroke="#1F2D45" stroke-width="10" stroke-linecap="round"/>
  <path d="M70 176 L67 142" stroke="#1F2D45" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="50" cy="178" rx="7" ry="3.5" fill="#152033"/><ellipse cx="72" cy="178" rx="7" ry="3.5" fill="#152033"/>
  <rect x="46" y="100" width="30" height="46" rx="9" fill="#0A2A5C"/>
  <circle cx="68" cy="112" r="3.5" fill="#22B8F0"/>
  <rect x="57" y="93" width="9" height="9" rx="3" fill="#D9A07A"/>
  <circle cx="62" cy="84" r="11.5" fill="#D9A07A"/>
  <path d="M50.5 83 a11.5 11.5 0 0 1 23 -2 q-7 -6 -16 -2 q-5 1 -7 4z" fill="#2B1D16"/>
  <path d="M72 108 L86 118" stroke="#0A2A5C" stroke-width="8" stroke-linecap="round"/>
  <path d="M86 118 L96 117" stroke="#D9A07A" stroke-width="6" stroke-linecap="round"/>
  <path d="M52 110 L70 126" stroke="#0A2A5C" stroke-width="8" stroke-linecap="round"/>
  <path d="M70 126 L94 122" stroke="#D9A07A" stroke-width="6" stroke-linecap="round"/>
</svg>
